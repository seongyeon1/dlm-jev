[project]
name = "dlm-jev"
version = "0.1.0"
description = "Jev-style typed decision engine on a diffusion language model (DiffusionGemma, MLX)"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["dlm", "diffusion-language-model", "jev", "typed-decisions", "calibration", "mlx", "diffusiongemma"]
readme = "README.md"
authors = [
    { name = "seongyeon", email = "ksy974498@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "mlx-vlm>=0.7.4",
    "numpy>=2.5.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mlx-lm>=0.31.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
dlm-jev-serve = "dlm_jev.server:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
